id: S-M06-01-musikalische-wiedergabe
module: M06
title: Wiedergabe folgt dem musikalischen Ablauf
goal: Die Playback-Linie als musikalischen Interpreten des Stückablaufs zeigen.
fixture: krippen-demo
entryState: demo-open-playback-stopped
actions:
  - Wiedergabe starten
  - Wiedergabelinie verfolgen
  - Wiederholung und Variantenende sichtbar durchlaufen
  - Ablaufhinweise und Parts in einem kurzen Diagramm ergänzen
